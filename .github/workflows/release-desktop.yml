name: Release Scisiam for Windows

on:
  push:
    tags:
      - "app-v*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: windows-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Validate tag, version, and main ancestry
        id: metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^app-v(\d+\.\d+\.\d+)$') {
            throw "Release tag must match app-v<major>.<minor>.<patch>"
          }
          $tagVersion = $Matches[1]
          $appVersion = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tagVersion -ne $appVersion) {
            throw "Tag version does not match the Tauri app version"
          }
          git fetch origin main --no-tags
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag must reference a commit reachable from origin/main"
          }
          "version=$tagVersion" >> $env:GITHUB_OUTPUT

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run security regressions
        run: >-
          node --test
          tests/security-remediation.test.mjs
          tests/security-hardening.test.mjs
          tests/tauri-desktop.test.mjs

      - name: Lint web source
        run: npm run lint

      - name: Build web application
        run: npm run build

      - name: Check desktop crate
        run: npm run desktop:check

  build:
    name: Build unsigned Windows artifacts
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out verified source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Build with an ephemeral updater key
        shell: pwsh
        run: |
          $ephemeralPassword = [guid]::NewGuid().ToString("N")
          $ephemeralKeyPath = Join-Path $env:RUNNER_TEMP "scisiam-ephemeral.key"
          npx --no-install tauri signer generate --ci --password $ephemeralPassword --write-keys $ephemeralKeyPath
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to generate ephemeral updater key"
          }
          $env:TAURI_SIGNING_PRIVATE_KEY = Get-Content -Raw -LiteralPath $ephemeralKeyPath
          $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = $ephemeralPassword
          npx --no-install tauri build --bundles nsis
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri build failed"
          }

      - name: Upload build artifacts without signatures
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scisiam-windows-${{ needs.verify.outputs.version }}
          if-no-files-found: error
          retention-days: 3
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip

  sign-and-release:
    name: Sign and prepare draft release
    needs:
      - verify
      - build
    runs-on: windows-latest
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install pinned Tauri signer without lifecycle scripts
        run: npm install --global @tauri-apps/cli@2.11.4 --ignore-scripts

      - name: Download verified build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: scisiam-windows-${{ needs.verify.outputs.version }}
          path: release-artifacts

      - name: Sign updater archive
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $archives = @(Get-ChildItem release-artifacts -Recurse -Filter *.nsis.zip)
          if ($archives.Count -ne 1) {
            throw "Expected exactly one NSIS updater archive"
          }
          tauri signer sign $archives[0].FullName
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path "$($archives[0].FullName).sig")) {
            throw "Updater signing failed"
          }

      - name: Create bounded updater manifest
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $archives = @(Get-ChildItem release-artifacts -Recurse -Filter *.nsis.zip)
          $archive = $archives[0]
          $signature = (Get-Content -Raw -LiteralPath "$($archive.FullName).sig").Trim()
          if ($signature.Length -lt 32 -or $signature.Length -gt 4096) {
            throw "Updater signature length is invalid"
          }
          $assetName = [uri]::EscapeDataString($archive.Name)
          $downloadUrl = "https://github.com/$env:RELEASE_REPOSITORY/releases/download/$env:RELEASE_TAG/$assetName"
          $manifest = @{
            version = $env:RELEASE_VERSION
            notes = "Scisiam เวอร์ชันใหม่พร้อมใช้งาน"
            pub_date = [DateTime]::UtcNow.ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5
          [IO.File]::WriteAllText(
            (Join-Path $PWD "release-artifacts/latest.json"),
            $manifest,
            [Text.UTF8Encoding]::new($false)
          )

      - name: Create draft release and upload signed assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          gh release create $env:RELEASE_TAG --draft --verify-tag --title "Scisiam $env:RELEASE_VERSION สำหรับ Windows" --notes "Scisiam เวอร์ชันใหม่พร้อมใช้งาน`n`nตรวจสอบและเผยแพร่ draft นี้หลังผ่าน Authenticode gate"
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to create draft release"
          }
          $assets = @(
            Get-ChildItem release-artifacts -Recurse -File |
              Where-Object { $_.Name -match '\.(exe|nsis\.zip|sig|json)$' } |
              ForEach-Object { $_.FullName }
          )
          gh release upload $env:RELEASE_TAG $assets
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to upload draft release assets"
          }
